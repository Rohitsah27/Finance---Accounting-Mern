<!DOCTYPE html>
<html lang="en" style="background-color: #1A1D23;">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Database Reset — DevTools | VeriDex</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    body {
      background: radial-gradient(circle at center, #f8fafc, #e2e8f0);
      color: #334155;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      overflow: hidden;
    }
    .reset-container {
      background: #ffffff;
      border: 1px solid rgba(13, 27, 75, 0.08);
      border-radius: 16px;
      padding: 40px;
      width: 480px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(13, 27, 75, 0.08);
    }
    .brand-header {
      font-size: 11px;
      font-weight: 800;
      color: #38bdf8;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 24px;
      display: inline-block;
      padding: 4px 10px;
      background: rgba(56, 189, 248, 0.1);
      border-radius: 20px;
    }
    .db-icon-container {
      width: 80px;
      height: 80px;
      background: rgba(13, 27, 75, 0.03);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
    }
    .db-icon {
      font-size: 40px;
      animation: pulse 2s infinite ease-in-out;
    }
    h1 {
      font-size: 24px;
      font-weight: 800;
      margin: 0 0 10px;
      color: #0d1b4b;
    }
    p {
      color: #64748b;
      font-size: 14px;
      line-height: 1.5;
      margin: 0 0 30px;
    }
    .status-box {
      background: #0f172a; /* Dark terminal look inside light mode looks excellent */
      color: #e2e8f0;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 30px;
      text-align: left;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 12.5px;
      line-height: 1.6;
      height: 130px;
      overflow-y: auto;
      border: 1px solid rgba(13, 27, 75, 0.05);
      box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.2);
    }
    .log-line {
      margin-bottom: 6px;
      color: #38bdf8;
    }
    .log-line.success {
      color: #4ade80;
    }
    .log-line.error {
      color: #f87171;
    }
    .loader-container {
      display: flex;
      justify-content: center;
      margin-bottom: 24px;
    }
    .loader {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(13, 27, 75, 0.08);
      border-top: 3px solid #0284c7;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .btn-reset {
      display: block;
      width: 100%;
      box-sizing: border-box;
      background: linear-gradient(135deg, #0d1b4b, #1e293b);
      color: #ffffff;
      border: none;
      padding: 14px 24px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
      box-shadow: 0 4px 14px rgba(13, 27, 75, 0.25);
    }
    .btn-reset:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(13, 27, 75, 0.35);
    }
    .btn-reset.disabled {
      background: #e2e8f0;
      color: #94a3b8;
      cursor: not-allowed;
      box-shadow: none;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }
  </style>
</head>
<body>

  <div class="reset-container">
    <div class="brand-header">Veridex DevTools</div>
    
    <div class="db-icon-container">
      <div class="db-icon" id="db-icon">🗄️</div>
    </div>
    
    <h1 id="title-label">Resetting Database...</h1>
    <p id="desc-label">Wiping local demo storage and rebuilding the clean credentials list.</p>
    
    <div class="loader-container" id="loader-container">
      <div class="loader" id="loader"></div>
    </div>
    
    <div class="status-box" id="status-box">
      <div class="log-line">Initializing DevTools reset engine...</div>
    </div>
    
    <a href="index.html" class="btn-reset disabled" id="action-btn">Sign In →</a>
  </div>

  <script>
    const statusBox = document.getElementById('status-box');
    const actionBtn = document.getElementById('action-btn');
    const loader = document.getElementById('loader');
    const loaderContainer = document.getElementById('loader-container');
    const titleLabel = document.getElementById('title-label');
    const dbIcon = document.getElementById('db-icon');

    function log(message, type = '') {
      const div = document.createElement('div');
      div.className = `log-line ${type}`;
      div.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
      statusBox.appendChild(div);
      statusBox.scrollTop = statusBox.scrollHeight;
    }

    async function runReset() {
      try {
        // 1. CLEAR LOCAL DEMO STORAGE
        log('Clearing local demo storage...');
        localStorage.clear();
        sessionStorage.clear();
        log('Local cache cleared.', 'success');

        // 2. SEED THE DEFAULT CREDENTIALS
        log('Seeding default credentials...');
        const defaultCreds = [
          { "email": "carrier@gmail.com", "password": "admin@123" },
          { "email": "mga@gmail.com", "password": "admin@123" },
          { "email": "broker@gmail.com", "password": "admin@123" },
          { "email": "insured@gmail.com", "password": "admin@123" }
        ];
        localStorage.setItem('credentials', JSON.stringify(defaultCreds));
        log('Successfully inserted 4 default accounts!', 'success');

        // 3. COMPLETE RESET
        log('Local database clean slate operation complete.', 'success');

        // Update UI
        titleLabel.textContent = 'Database Reset Complete!';
        dbIcon.textContent = '✅';
        loaderContainer.style.display = 'none';
        actionBtn.className = 'btn-reset';
        actionBtn.style.background = 'linear-gradient(135deg, #10b981, #059669)';
        actionBtn.style.boxShadow = '0 4px 14px rgba(16, 185, 129, 0.3)';
        
      } catch (err) {
        log(`Error resetting database: ${err.message}`, 'error');
        titleLabel.textContent = 'Database Reset Failed';
        dbIcon.textContent = '❌';
        loader.style.borderColor = '#f87171';
        loader.style.borderTopColor = '#ef4444';
        actionBtn.className = 'btn-reset';
        actionBtn.textContent = 'Retry Reset';
        actionBtn.style.background = 'linear-gradient(135deg, #ef4444, #dc2626)';
        actionBtn.style.boxShadow = '0 4px 14px rgba(239, 68, 68, 0.3)';
        actionBtn.onclick = () => window.location.reload();
      }
    }

    // Run automatically on load
    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(runReset, 800);
    });
  </script>
</body>
</html>
